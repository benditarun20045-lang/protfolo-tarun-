.grid-bg{background-image:linear-gradient(rgba(34,211,238,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(34,211,238,.07) 1px,transparent 1px);background-size:44px 44px;animation:drift 12s linear infinite;mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%);-webkit-mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%)}

.node{animation:pulse2 3s ease-in-out infinite}
.glass{background:rgba(255,255,255,.04);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(148,163,184,.15)}
.rv{opacity:0;transform:translateY(28px);transition:opacity .7s ease,transform .7s ease}
.rv.in{opacity:1;transform:none}
.glow{box-shadow:0 0 0 3px #0a1220,0 0 0 5px #22d3ee,0 0 40px rgba(34,211,238,.45)}

function Reveal({children,delay=0,className=""}){
  const r=useRef(null);const [v,setV]=useState(false);
  useEffect(()=>{const o=new IntersectionObserver(([e])=>{if(e.isIntersecting){setV(true);o.disconnect()}},{threshold:.12});o.observe(r.current);return()=>o.disconnect()},[]);
  return <div ref={r} className={`rv ${v?"in":""} ${className}`} style={{transitionDelay:delay+"ms"}}>{children}</div>;
}

function Spark({d,color="#22d3ee"}){
  const w=200,h=50,m=Math.max(...d);
  const pts=d.map((y,i)=>`${(i/(d.length-1))*w},${h-(y/m)*(h-6)-3}`).join(" ");
  return <svg viewBox={`0 0 ${w} ${h}`} className="w-full h-12"><polyline points={pts} fill="none" stroke={color} strokeWidth="2" strokeLinejoin="round"/><polyline points={`0,${h} ${pts} ${w},${h}`} fill={color} opacity=".12"/></svg>;
}

      <Reveal><img src={IMG} alt="Bendi Tarun" className="w-36 h-36 sm:w-44 sm:h-44 rounded-full object-cover object-top mx-auto glow"/></Reveal>

      <Reveal delay={100}><h1 className="text-4xl sm:text-6xl font-extrabold mt-3 leading-tight">Hi, I'm <span className="text-cyan-400">Bendi Tarun.</span><br/>Data Analyst &amp; Problem Solver.</h1></Reveal>
      <Reveal delay={200}><p className="mt-5 text-slate-400 text-base sm:text-lg">B.Tech in Computer Science, Parul University (Class of 2026) | Specializing in SQL, Python, and Machine Learning.</p></Reveal>
      <Reveal delay={300} className="mt-9 flex flex-col sm:flex-row gap-4 justify-center">
        <a href="#projects" className="px-7 py-3 rounded-lg bg-cyan-400 text-slate-900 font-semibold hover:bg-cyan-300 hover:-translate-y-0.5 transition shadow-lg shadow-cyan-500/20">View Projects</a>
        <a href={LINKS.li} target="_blank" rel="noreferrer" className="px-7 py-3 rounded-lg border border-cyan-400 text-cyan-300 font-semibold hover:bg-cyan-400/10 hover:-translate-y-0.5 transition">Download Resume</a>
      </Reveal>
    </div>
  </section>;
}

function Profile(){
  const stats=[["3","Projects"],["1","Internship"],["2026","B.Tech Grad"],["6+","Tools"]];
  const bars=[["SQL",88],["Python",85],["Power BI",82],["Excel",90],["ML / CV",70]];
  return <section id="profile" className="max-w-6xl mx-auto px-5 py-20">
    <Title k="Profile" t="About me"/>
    <div className="grid md:grid-cols-5 gap-6">
      <Reveal className="md:col-span-3 glass rounded-2xl p-6 sm:p-8">
        <p className="text-slate-300 leading-relaxed">Motivated, detail-oriented B.Tech Computer Science graduate and data analytics fresher. I clean and model data with SQL, Excel, Power Query and Python (Pandas, NumPy), then turn it into dashboards and insights using Power BI, Matplotlib and Seaborn.</p>
        <p className="text-slate-300 leading-relaxed mt-4">I'm looking for an entry-level <span className="text-cyan-300">Data Analyst / Business Intelligence Analyst</span> role where I can apply analytical and technical skills to real business problems.</p>
        <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 mt-7">{stats.map(([a,b])=><div key={b} className="rounded-xl bg-white/5 p-4 text-center"><div className="text-2xl font-extrabold text-cyan-400">{a}</div><div className="text-xs text-slate-400 mt-1">{b}</div></div>)}</div>
        <div className="flex flex-wrap gap-2 mt-6">{["Analytical Thinking","Problem Solving","Attention to Detail","Quick Learner","Communication","Teamwork"].map(s=><span key={s} className="text-xs px-3 py-1 rounded-full border border-slate-600 text-slate-300">{s}</span>)}</div>
      </Reveal>
      <Reveal delay={150} className="md:col-span-2 glass rounded-2xl p-6 sm:p-8">
        <h3 className="font-semibold mb-5">Proficiency snapshot</h3>
        {bars.map(([n,v])=><div key={n} className="mb-4"><div className="flex justify-between text-sm mb-1"><span>{n}</span><span className="text-slate-400">{v}%</span></div><div className="h-2 rounded bg-white/10"><div className="h-2 rounded bg-gradient-to-r from-teal-400 to-cyan-300" style={{width:v+"%"}}/></div></div>)}
        <p className="text-xs text-slate-500">Self-assessed, for illustration.</p>
      </Reveal>
    </div>
  </section>;
}

function Skills(){
  const cats=[
    {t:"Data & Databases",i:I.db,s:["SQL","MySQL","Power BI / DAX","Excel"],c:"md:col-span-2"},
    {t:"Programming & ML",i:I.code,s:["Python","Pandas","NumPy","OpenCV","YOLO","NLP","Matplotlib","Seaborn"],c:"md:col-span-2"},
    {t:"Core Competencies",i:I.cpu,s:["Algorithm Design","Statistical Analysis","EDA","Data Visualization"],c:"md:col-span-2"}];
  return <section id="skills" className="max-w-6xl mx-auto px-5 py-20">
    <Title k="Toolset" t="Skills & Technologies"/>
    <div className="grid md:grid-cols-6 gap-5">{cats.map((c,i)=><Reveal key={c.t} delay={i*100} className={c.c}>
      <div className="glass rounded-2xl p-6 h-full hover:border-cyan-400/40 transition">
        <div className="flex items-center gap-3 mb-5"><span className="w-9 h-9 rounded-lg bg-cyan-400/10 text-cyan-400 flex items-center justify-center"><Ico p={c.i}/></span><h3 className="font-semibold">{c.t}</h3></div>
        <div className="flex flex-wrap gap-2">{c.s.map(s=><span key={s} className="glass text-sm px-3 py-1.5 rounded-lg text-slate-200 hover:text-cyan-300 hover:-translate-y-0.5 transition cursor-default">{s}</span>)}</div>
      </div></Reveal>)}</div>
  </section>;
}

const PROJ=[
  {t:"Human Detector & Counter Analytics",d:"Python-based computer vision system tracking real-time object metrics from image and video streams using OpenCV and YOLO.",tags:["Python","OpenCV","YOLO","TensorFlow"],m:"Real-time counting",s:[3,5,4,7,6,9,8,11]},
  {t:"NLP Text Analyzer",d:"Processes unstructured text into structured insights using word-embedding architectures (Skip-Gram / CBOW).",tags:["Python","NLP","Skip-Gram","CBOW"],m:"Word embeddings",s:[2,4,3,6,8,7,10,12]},
  {t:"Predictive Plant Disease Detection",d:"Flask-based diagnostic tool that uses machine learning models to classify and analyze agricultural data.",tags:["Flask","Python","ML"],m:"Classification",s:[4,3,6,5,8,9,9,11]}];
function Projects(){
  return <section id="projects" className="max-w-6xl mx-auto px-5 py-20">
    <Title k="Showcase" t="Data & ML Projects"/>
    <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-6">{PROJ.map((p,i)=><Reveal key={p.t} delay={i*120}>
      <article className="glass rounded-2xl p-6 h-full flex flex-col transition duration-300 hover:-translate-y-2 hover:shadow-2xl hover:shadow-cyan-500/10 hover:border-cyan-400/40">
        <div className="flex items-center justify-between text-xs text-slate-400 mb-2"><span className="flex gap-1"><i className="w-2 h-2 rounded-full bg-red-400/70"/><i className="w-2 h-2 rounded-full bg-yellow-400/70"/><i className="w-2 h-2 rounded-full bg-green-400/70"/></span><span>{p.m}</span></div>
        <Spark d={p.s}/>
        <h3 className="font-bold text-lg mt-4">{p.t}</h3>
        <p className="text-slate-400 text-sm mt-2 flex-1">{p.d}</p>
        <div className="flex flex-wrap gap-2 mt-4">{p.tags.map(t=><span key={t} className="text-xs px-2 py-1 rounded bg-cyan-400/10 text-cyan-300">{t}</span>)}</div>
        <a href={LINKS.gh} target="_blank" rel="noreferrer" className="mt-5 text-sm font-semibold text-cyan-400 hover:text-cyan-300">View Case Study / GitHub &rarr;</a>
      </article></Reveal>)}</div>
  </section>;
}

function Timeline(){
  const it=[["2022","Started B.Tech in Computer Science","Parul University: foundations in programming, databases and algorithms."],
  ["Training","Data Analytics coursework","Python, SQL, Excel and Power BI for data analysis and visualization."],
  ["Internship","Python / Computer Vision Intern","Innovate by Hexagon: built a human detector and counter surveillance system."],
  ["Projects","Industry-style analytics projects","Sales dashboard in Power BI, customer churn EDA in Python, ML systems."],
  ["2026","B.Tech graduate (Class of 2026)","Parul University: seeking an entry-level Data Analyst role."]];
  return <section id="education" className="max-w-3xl mx-auto px-5 py-20">
    <Title k="Journey" t="Education & Milestones"/>
    <div className="relative border-l border-cyan-400/30 ml-3">{it.map(([a,b,c],i)=><Reveal key={b} delay={i*80} className="pl-8 pb-10 relative">
      <span className="absolute -left-[7px] top-1.5 w-3.5 h-3.5 rounded-full bg-cyan-400 shadow-[0_0_12px_#22d3ee]"/>
      <p className="text-cyan-400 text-xs font-semibold uppercase tracking-wider">{a}</p>
      <h3 className="font-semibold text-lg">{b}</h3><p className="text-slate-400 text-sm mt-1">{c}</p></Reveal>)}</div>
  </section>;
}

function Contact(){
  const [f,setF]=useState({name:"",email:"",msg:""});const [sent,setSent]=useState(false);
  const submit=()=>{
    if(!f.name||!f.email||!f.msg)return;
    const body=encodeURIComponent(`${f.msg}\n\nFrom: ${f.name} (${f.email})`);
    window.location.href=`mailto:${LINKS.mail}?subject=${encodeURIComponent("Portfolio message from "+f.name)}&body=${body}`;
    setSent(true);
  };
  const inp="w-full rounded-lg bg-white/5 border border-slate-600/50 px-4 py-3 outline-none focus:border-cyan-400 transition text-slate-100";
  return <section id="contact" className="max-w-xl mx-auto px-5 py-20 text-center">
    <Title k="Contact" t="Let's work together"/>
    <Reveal className="glass rounded-2xl p-6 sm:p-8 text-left space-y-4">
      <input className={inp} placeholder="Name" value={f.name} onChange={e=>setF({...f,name:e.target.value})}/>
      <input className={inp} type="email" placeholder="Email" value={f.email} onChange={e=>setF({...f,email:e.target.value})}/>
      <textarea className={inp} rows="4" placeholder="Message" value={f.msg} onChange={e=>setF({...f,msg:e.target.value})}/>
      <button onClick={submit} className="w-full py-3 rounded-lg bg-cyan-400 text-slate-900 font-semibold hover:bg-cyan-300 transition">Send</button>
      {sent&&<p className="text-sm text-cyan-300 text-center">Your email app should open with the message ready to send.</p>}
    </Reveal>
    <div className="mt-10 space-y-2 text-sm text-slate-300"><a href={"tel:"+LINKS.tel} className="flex items-center justify-center gap-2 hover:text-cyan-400"><Ico p={I.tel}/>{LINKS.telShow}</a><a href={"mailto:"+LINKS.mail} className="flex items-center justify-center gap-2 hover:text-cyan-400"><Ico p={I.mail}/>{LINKS.mail}</a></div>
    <div className="flex justify-center gap-4 mt-6">{[["LinkedIn",I.li,LINKS.li],["GitHub",I.gh,LINKS.gh],["LeetCode",I.lc,LINKS.lc],["Email",I.mail,"mailto:"+LINKS.mail],["Phone",I.tel,"tel:"+LINKS.tel]].map(([n,p,h])=><a key={n} href={h} target="_blank" rel="noreferrer" aria-label={n} className="w-11 h-11 rounded-full glass flex items-center justify-center text-slate-300 hover:text-cyan-400 hover:-translate-y-1 transition"><Ico p={p}/></a>)}</div>
    <p className="text-slate-500 text-sm mt-10">&copy; 2026 Bendi Tarun. All rights reserved.</p>
  </section>;
}

function App(){return <><Nav/><Hero/><Profile/><Skills/><Projects/><Timeline/><Contact/></>;}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
